openapi: 3.0.3
info:
  title: TransactionApi
  version: 1.0.0
  description: >-
    REST API for the Transaction Import and Approval app. Every endpoint requires
    a signed-in session (sent as the HttpOnly `txn_session` cookie) unless it is
    explicitly marked as anonymous. A person can be signed in in one place at a
    time, and a session ends after a period of inactivity (60 minutes by default);
    any authenticated request resets that period. When a request is refused with
    401, the `reason` in the response says why, so the caller can tell an expired
    session or a sign-in elsewhere from never having signed in. When a signed-in
    person's role does not allow an endpoint, the request is refused with 403.
servers:
  - url: http://localhost:5100/api
tags:
  - name: Authentication
    description: Signing in, identifying the signed-in person, and signing out.
  - name: Files
    description: Uploading transaction files (importers only), listing files, a file's details, original content and invalid rows, correcting and re-checking a file (importers only), and cancelling a file (importers only).
  - name: Dashboard
    description: The figures shown above the dashboard's file list.
paths:
  /dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: GetDashboardSummary
      summary: Get the number of files and of transactions in each status.
      description: >-
        Counts the files in each status, and the transactions that are Imported,
        Approved and Rejected, over every file that is not cancelled (DB-01).
        Available to every signed-in person.
      responses:
        '200':
          description: The dashboard figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/sign-in:
    post:
      tags: [Authentication]
      operationId: SignIn
      summary: Sign in with email address and password (anonymous).
      description: >-
        Starts a server-side session and returns it as the HttpOnly `txn_session`
        cookie. A person can be signed in in one place at a time, so any other
        active session of the same person is ended; its cookie is then refused
        with the reason `SignedInElsewhere`. A wrong email address and a wrong
        password both return the same 401 response, so the caller can never tell
        which of the two was wrong.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in. The session cookie is set and the signed-in person is returned.
          headers:
            Set-Cookie:
              description: The HttpOnly `txn_session` session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          description: The email address or password is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: The email address or password is wrong ("Invalid email or password").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: GetCurrentUser
      summary: Get the person who is signed in with the current session.
      description: >-
        Like every authenticated request, this counts as activity and resets the
        session's inactivity timeout.
      responses:
        '200':
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/sign-out:
    post:
      tags: [Authentication]
      operationId: SignOut
      summary: Sign out on every device (anonymous, idempotent).
      description: >-
        When the `txn_session` cookie identifies an active session, ends every
        active session of that person, so they are signed out on every device;
        the other devices' cookies are then refused with the reason `SignedOut`.
        Always clears the cookie and always succeeds, even when there is no valid
        session (in which case no other session is affected).
      security: []
      responses:
        '204':
          description: Signed out. The session cookie is cleared.
  /files:
    get:
      tags: [Files]
      operationId: ListFiles
      summary: List files one page at a time, sorted and filtered (DB-02..DB-06).
      description: >-
        Returns one page of files with the total number of files that match the
        filters. Available to every signed-in person. By default the most recently
        processed file comes first. A file that has not been processed yet has no
        `lastProcessedAt` (null) and counts as more recent than any processed file,
        so files waiting to be processed come first. Any column can be sorted on,
        one at a time. Files with the same value in the sorted column are ordered
        by the order in which they were received (in the same direction), so
        paging is deterministic. Values that are not known yet (null) sort after
        every other value in ascending order and before them in descending order.
        All filters combine. An empty result is an empty `items` list with a
        `totalCount` of 0. Unknown or invalid query values are refused with 400.
      parameters:
        - name: page
          in: query
          required: false
          description: The 1-based page number. A page past the last page is empty.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: The number of files per page; one of 5, 10, 20 or 50.
          schema:
            type: integer
            format: int32
            default: 20
        - name: sortBy
          in: query
          required: false
          description: The column to sort on. Defaults to `LastProcessedAt`.
          schema:
            $ref: '#/components/schemas/FileSortColumn'
        - name: sortDirection
          in: query
          required: false
          description: >-
            The sort direction. Defaults to `Desc` when sorting on `LastProcessedAt`
            (the default column), and to `Asc` for every other column.
          schema:
            $ref: '#/components/schemas/SortDirection'
        - name: status
          in: query
          required: false
          description: Lists only the files with this status.
          schema:
            $ref: '#/components/schemas/FileStatus'
        - name: fileName
          in: query
          required: false
          description: >-
            Lists only the files whose name contains this text, ignoring upper and
            lower case. Every character is matched literally (no wildcards).
          schema:
            type: string
        - name: processedFrom
          in: query
          required: false
          description: >-
            Lists only the files last processed at or after this date and time
            (inclusive). A file that has not been processed yet never matches a
            process-date filter. To filter by whole days, send the start of the
            first day in the person's time zone, e.g. `2026-04-15T00:00:00+02:00`
            (URL-encode the `+` as `%2B`).
          schema:
            type: string
            format: date-time
        - name: processedTo
          in: query
          required: false
          description: >-
            Lists only the files last processed at or before this date and time
            (inclusive). To filter by whole days, send the end of the last day in
            the person's time zone, e.g. `2026-04-15T23:59:59.999+02:00`. Must not
            be earlier than `processedFrom`.
          schema:
            type: string
            format: date-time
        - name: visibility
          in: query
          required: false
          description: Which files to list by whether they are cancelled. Defaults to `Active` (DB-06).
          schema:
            $ref: '#/components/schemas/FileVisibility'
      responses:
        '200':
          description: One page of files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePage'
        '400':
          description: >-
            A query value is invalid: an unknown sort column, sort direction,
            status or visibility, a page below 1, a page size other than 5, 10,
            20 or 50, a date and time that cannot be read, or `processedFrom`
            later than `processedTo`. The failing query parameters are listed
            under `errors`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Files]
      operationId: UploadFile
      summary: Upload a transaction file (importers only).
      description: >-
        Hands a file over for processing and returns at once with the status
        `Uploaded`. The exact original bytes are kept. Checking and loading the
        file happen afterwards, in the background. Only `.csv` files are accepted
        (the extension is matched regardless of upper and lower case). The file
        name must not be empty, must be 255 characters or fewer, and must not
        contain `..`, `\`, `/` or `:`. Files larger than the configured maximum
        upload size (10 MB by default) are refused with 413.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload, with its original file name.
                kind:
                  $ref: '#/components/schemas/FileKind'
      responses:
        '201':
          description: The file has been received and is waiting to be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
        '400':
          description: >-
            The file name is invalid ("Invalid file name"), the file is not a
            `.csv` file, the file is missing, or the file kind is unknown. A
            refused file name or file type is described by `message`; a missing
            file or unknown kind is reported as a validation problem.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: The file is larger than the maximum upload size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /files/{fileId}:
    get:
      tags: [Files]
      operationId: GetFile
      summary: Get a file's details and processing history (FD-01, FD-03, FD-04, FD-06, FD-07).
      description: >-
        Returns everything the file's detail screen shows, including its processing history, in one
        response. Available to every signed-in person, for active and cancelled files alike.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: The file's details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDetails'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FileNotFound'
  /files/{fileId}/content:
    get:
      tags: [Files]
      operationId: DownloadFile
      summary: Download the original file exactly as it was uploaded (FD-05).
      description: >-
        Returns the exact bytes that were uploaded, unchanged (including any byte-order mark and the
        original line endings), as `text/csv` with no charset, since the file's encoding is never
        assumed. The `Content-Disposition` header is `attachment` and carries the original file name
        both as `filename` and, encoded as UTF-8, as `filename*` (RFC 6266 / RFC 5987), so names
        with spaces or non-ASCII characters survive. Available to every signed-in person. Once a
        file has been cancelled, the app's copy of the original is discarded (FX-04) and the
        download is refused with 410 Gone, so a caller can tell a file that no longer has its
        original from a file that never existed (404).
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: The original file.
          headers:
            Content-Disposition:
              description: '`attachment` with the original file name, e.g. `attachment; filename=transactions_2026-04-15.csv; filename*=UTF-8''''transactions_2026-04-15.csv`.'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '410':
          description: >-
            The original file is no longer available because the file has been cancelled and its
            content discarded (FX-04).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /files/{fileId}/invalid-rows:
    get:
      tags: [Files]
      operationId: ListInvalidRows
      summary: List the invalid rows of a file waiting for corrections (FC-01, importers only).
      description: >-
        Lists only the invalid rows, in file order, each with a stable row id (used to correct the
        row), its row number (counting transaction rows from 1, not counting the header), every
        column value exactly as it was in the file and every reason it failed (FP-04). `totalCount`
        is how many invalid rows remain. Only a file that is Failed because of invalid rows and is
        not cancelled is waiting for corrections; for any other file the request is refused with
        409, so a caller never mistakes "nothing to correct" for "no invalid rows left".
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: The invalid rows still to be corrected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRowList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '409':
          $ref: '#/components/responses/NotWaitingForCorrections'
    patch:
      tags: [Files]
      operationId: SaveCorrections
      summary: Save corrected values on invalid rows without checking the file again (FC-02, importers only).
      description: >-
        Replaces the values of one or more invalid rows, identified by their row ids, with the values
        given, without checking the file again. Every one of the seven columns is replaced, so send
        the row's full set of values (an empty string for an empty value). A corrected row always has
        exactly the seven expected columns, so any surplus values the row had in the file are dropped.
        The rows keep the reasons found by the last check until the file is checked again
        (`POST /files/{fileId}/recheck`), so they stay invalid and can be corrected again. All the
        corrections are saved together or not at all. Only the file's invalid rows can be corrected.
        The original uploaded file is never changed (FD-05).
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RowCorrections'
      responses:
        '200':
          description: The invalid rows, with the saved values and the reasons from the last check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRowList'
        '400':
          $ref: '#/components/responses/InvalidCorrections'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '409':
          $ref: '#/components/responses/NotWaitingForCorrections'
  /files/{fileId}/recheck:
    post:
      tags: [Files]
      operationId: RecheckFile
      summary: Save any corrections and check the file again (FC-02, FC-03, FS-02, importers only).
      description: >-
        Saves the corrected values given for invalid rows (as `PATCH /files/{fileId}/invalid-rows`
        does) and then checks the file again, all in one database transaction, and returns the
        outcome straight away. `corrections` may be empty to check the file again with the values
        already saved.


        Checking again repeats stages 4 to 7 (Convert types, Check rows, then Wait for corrections or
        Load) over every row of the file, including the rows that were already valid, using the
        corrected values; so a correction can also clear or cause "Duplicate Reference In File" on
        other rows. The duplicate-file check is not repeated. The open Wait for corrections stage is
        finished and the new stages are added to the processing history.


        If every row now passes, the file is loaded as in stage 7 (status Imported, created by
        "System", rows whose reference already exists ignoring case are skipped and rows with an
        empty reference are ignored), the loaded / skipped / ignored counts are stored and the file
        becomes Completed. If any row still fails, nothing is loaded, the file stays Failed (invalid
        rows) with its failure reason updated to the new count, and `invalidRows` lists the rows that
        still fail and how many remain. Either way the file's last processed time is updated.


        Only one correction or re-check of a file runs at a time: a request made while another is
        under way waits for it and is then refused with 409 if the file is no longer waiting for
        corrections. The original uploaded file is never changed (FD-05).
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecheckRequest'
      responses:
        '200':
          description: The file was checked again; `status` says whether it loaded or still has invalid rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecheckResult'
        '400':
          $ref: '#/components/responses/InvalidCorrections'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '409':
          $ref: '#/components/responses/NotWaitingForCorrections'
  /files/{fileId}/cancel:
    post:
      tags: [Files]
      operationId: CancelFile
      summary: Cancel a file (FX-01..FX-06, FC-04, FD-08, importers only).
      description: >-
        Cancels the file and returns its details as `GET /files/{fileId}` returns them. The request
        has no body; asking the person to confirm, naming the file (FX-01), is up to the caller.


        A file with at least one Approved transaction cannot be cancelled and is refused with 409
        (FX-02); nothing changes. Imported and Rejected transactions do not prevent cancelling.


        Cancelling, all in one database transaction: removes the file's transactions, so they no
        longer appear in any list, summary or export, and a corrected file with the same references
        can be uploaded and loaded later (FX-03); discards the app's copy of the original file, so
        the download answers 410 (FX-04); stops a file waiting for corrections from waiting, by
        finishing its open Wait for corrections stage and discarding the rows kept for corrections
        (FX-04); records when the file was cancelled and by whom, and adds a `Cancelled` entry to the
        processing history. A cancelled file no longer counts in the dashboard summary and is hidden
        from the file list by default (FX-05, DB-06), and it no longer counts as an earlier file in
        the duplicate check (FP-01), so the same content can be uploaded again and loaded.


        A file can be cancelled whatever its status (Uploaded, Processing, Completed, or Failed as a
        duplicate or because of invalid rows) and keeps that status, except that a file that has
        been claimed for processing but whose processing has not started returns to Uploaded. A file
        that is being processed is cancelled once its processing has finished (the request waits for
        it), so the outcome of processing is never half undone. A cancelled file is never processed,
        corrected or checked again. A correction or re-check under way when the file is cancelled
        finishes first; one that starts after it is refused with 409.


        Cancelling a file that is already cancelled, by anyone, changes nothing and returns its
        details showing it cancelled, with the original cancel time and person (FX-06).
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: The file is cancelled (now, or already before); its details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDetails'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '409':
          description: >-
            The file has at least one Approved transaction, so it cannot be cancelled (FX-02). The
            `message` explains why and says how many transactions have been approved, e.g. "This
            file cannot be cancelled because 3 of its transactions have been approved." Nothing is
            changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    FileId:
      name: fileId
      in: path
      required: true
      description: The file's id.
      schema:
        type: string
        format: uuid
  responses:
    FileNotFound:
      description: No file has this id ("File not found").
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotWaitingForCorrections:
      description: >-
        The file is not waiting for corrections ("This file is not waiting for corrections."): it is
        not Failed because of invalid rows (for example it has already been loaded), or it has been
        cancelled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCorrections:
      description: >-
        The corrections cannot be applied. A row id that is not one of the file's invalid rows (a
        valid row, a row of another file or an unknown id) is refused with "Only the file's invalid
        rows can be corrected."; a row given more than once is refused with "Each row can be
        corrected only once in a request."; a missing value is reported as a validation problem.
        Nothing is saved.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - $ref: '#/components/schemas/ValidationProblem'
    Forbidden:
      description: >-
        The signed-in person's role does not allow this request. The `message`
        tells them they do not have access and to ask their administrator.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: >-
        There is no valid session. The `reason` says why, so the caller can show
        a suitable message on the sign-in screen.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthenticatedResponse'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: txn_session
  schemas:
    UserRole:
      type: string
      enum: [Importer, Approver]
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          example: fileimporter@digiata.com
        password:
          type: string
          minLength: 1
          format: password
          example: Test123
    CurrentUser:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          example: File Importer
        email:
          type: string
          example: fileimporter@digiata.com
        role:
          $ref: '#/components/schemas/UserRole'
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Invalid email or password
    UnauthenticatedReason:
      type: string
      description: >-
        Why a request was not authenticated. NotSignedIn - no session cookie, or
        one that was never issued. SessionExpired - the session ended after the
        inactivity timeout. SignedInElsewhere - the person signed in somewhere
        else, which ended this session. SignedOut - the session was ended by
        signing out (possibly on another device).
      enum: [NotSignedIn, SessionExpired, SignedInElsewhere, SignedOut]
    UnauthenticatedResponse:
      type: object
      required: [message, reason]
      properties:
        message:
          type: string
          example: Your session has expired after 60 minutes of inactivity. Please sign in again.
        reason:
          $ref: '#/components/schemas/UnauthenticatedReason'
    FileKind:
      type: string
      description: What kind of file is uploaded. There is one kind today.
      enum: [BankTransactions]
      default: BankTransactions
    FileStatus:
      type: string
      description: >-
        Uploaded - received and not yet checked. Processing - being checked or
        loaded. Completed - the transactions are loaded and ready for approval.
        Failed - a duplicate, or invalid rows are waiting for corrections.
      enum: [Uploaded, Processing, Completed, Failed]
    FailureKind:
      type: string
      description: >-
        Why a Failed file failed. Duplicate - it has the same content as an
        earlier file and stays failed (FS-01). InvalidRows - some rows are
        invalid and are waiting for corrections (FS-02).
      enum: [Duplicate, InvalidRows]
    FileSortColumn:
      type: string
      description: >-
        A column of the file list to sort on. `FileName` sorts ignoring upper and
        lower case. `Status` sorts in the order of a file's progress: Uploaded,
        Processing, Completed, Failed.
      enum: [FileName, LastProcessedAt, RowCount, Status, ImportedCount]
    SortDirection:
      type: string
      enum: [Asc, Desc]
    FileVisibility:
      type: string
      description: >-
        Active - only files that are not cancelled. Cancelled - only cancelled
        files. Both - every file.
      enum: [Active, Cancelled, Both]
    FileListItem:
      type: object
      required: [id, fileName, status, failureKind, failureReason, lastProcessedAt, rowCount, importedCount, isCancelled]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          example: transactions_2026-04-15.csv
        status:
          $ref: '#/components/schemas/FileStatus'
        failureKind:
          description: Why the file failed; null unless the status is Failed.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FailureKind'
        failureReason:
          type: string
          nullable: true
          description: The message describing why the file failed; null unless the status is Failed.
        lastProcessedAt:
          type: string
          format: date-time
          nullable: true
          description: When processing of the file last finished; null while it has never been processed.
        rowCount:
          type: integer
          format: int32
          nullable: true
          description: The number of transaction rows in the file; null until the file has been read.
        importedCount:
          type: integer
          format: int32
          description: How many of the file's transactions are still Imported.
        isCancelled:
          type: boolean
    FilePage:
      type: object
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileListItem'
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
          description: The number of files that match the filters, over every page.
        totalPages:
          type: integer
          format: int32
          description: The number of pages; 0 when no file matches.
    FileStatusCounts:
      type: object
      required: [uploaded, processing, completed, failed]
      properties:
        uploaded:
          type: integer
          format: int32
        processing:
          type: integer
          format: int32
        completed:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
    TransactionStatusCounts:
      type: object
      required: [imported, approved, rejected]
      properties:
        imported:
          type: integer
          format: int32
        approved:
          type: integer
          format: int32
        rejected:
          type: integer
          format: int32
    DashboardSummary:
      type: object
      description: Counts over every file that is not cancelled (DB-01).
      required: [files, transactions]
      properties:
        files:
          $ref: '#/components/schemas/FileStatusCounts'
        transactions:
          $ref: '#/components/schemas/TransactionStatusCounts'
    UploadedFile:
      type: object
      required: [id, fileName, kind, status, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          example: transactions_2026-04-15.csv
        kind:
          $ref: '#/components/schemas/FileKind'
        status:
          $ref: '#/components/schemas/FileStatus'
        uploadedAt:
          type: string
          format: date-time
    ProcessingStage:
      type: string
      description: >-
        A stage of processing a file, in the order they run. `Cancelled` is not a processing stage
        but an entry recording when the file was cancelled; it starts and finishes at that moment
        and is always the last entry.
      enum: [Receive, DuplicateCheck, ReadRows, ConvertTypes, CheckRows, WaitForCorrections, Load, Cancelled]
    ProcessingStageEntry:
      type: object
      required: [stage, startedAt, finishedAt]
      properties:
        stage:
          $ref: '#/components/schemas/ProcessingStage'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: When the stage finished; null while it is still under way (e.g. WaitForCorrections).
    FileDetails:
      type: object
      description: >-
        A file's details (FD-01, FD-03, FD-06, FD-07) and processing history (FD-04).
      required:
        - id
        - fileName
        - kind
        - status
        - failureKind
        - failureReason
        - uploadedBy
        - uploadedAt
        - lastProcessedAt
        - isCancelled
        - cancelledAt
        - cancelledBy
        - rowCount
        - loadedCount
        - skippedExistingCount
        - ignoredEmptyReferenceCount
        - transactions
        - isFullyReviewed
        - areTransactionsAvailable
        - canDownload
        - processingHistory
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          example: transactions_2026-04-15.csv
        kind:
          $ref: '#/components/schemas/FileKind'
        status:
          $ref: '#/components/schemas/FileStatus'
        failureKind:
          description: Why the file failed; null unless the status is Failed (FD-06).
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FailureKind'
        failureReason:
          type: string
          nullable: true
          description: The message describing why the file failed; null unless the status is Failed (FD-06).
        uploadedBy:
          type: string
          description: The name of the person who uploaded the file.
          example: File Importer
        uploadedAt:
          type: string
          format: date-time
        lastProcessedAt:
          type: string
          format: date-time
          nullable: true
          description: When processing of the file last finished; null while it has never been processed.
        isCancelled:
          type: boolean
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          description: When the file was cancelled; null unless it is cancelled.
        cancelledBy:
          type: string
          nullable: true
          description: >-
            The name of the person who cancelled the file; null unless it is cancelled (and for a
            file cancelled before this was recorded).
          example: File Importer
        rowCount:
          type: integer
          format: int32
          nullable: true
          description: The number of transaction rows in the file, not counting the header; null until the file has been read.
        loadedCount:
          type: integer
          format: int32
          nullable: true
          description: >-
            How many rows were loaded as transactions (FP-07). The three row counts are null until
            the file has been loaded (Completed) and then always add up to `rowCount`.
        skippedExistingCount:
          type: integer
          format: int32
          nullable: true
          description: How many rows were skipped because their reference already existed (FP-05, FP-07).
        ignoredEmptyReferenceCount:
          type: integer
          format: int32
          nullable: true
          description: How many rows were ignored because their reference was empty (FP-07).
        transactions:
          description: >-
            How many of the file's transactions are Imported, Approved and Rejected (FD-01). All zero
            while nothing has been loaded, for a failed file, and for a cancelled file (whose
            transactions are removed, FX-03).
          allOf:
            - $ref: '#/components/schemas/TransactionStatusCounts'
        isFullyReviewed:
          type: boolean
          description: >-
            True when the file is Completed, not cancelled, and none of its transactions is still
            Imported (FD-03). A Completed file with no transactions at all (every row skipped as
            existing or ignored for an empty reference) is fully reviewed, since nothing from it
            awaits review.
        areTransactionsAvailable:
          type: boolean
          description: >-
            False while the file is Uploaded or Processing, when its transactions are not available
            yet (FD-07); true once processing has finished (Completed or Failed).
        canDownload:
          type: boolean
          description: >-
            Whether the original file can still be downloaded (FD-05). False once the file is
            cancelled, because its copy of the original is discarded (FX-04).
        processingHistory:
          type: array
          description: Each stage the file has been through, in the order they ran (FD-04).
          items:
            $ref: '#/components/schemas/ProcessingStageEntry'
    InvalidRow:
      type: object
      description: An invalid row with every column value exactly as it was in the file.
      required: [id, rowNumber, reference, transactionDate, accountNumber, description, amount, transactionType, currency, reasons]
      properties:
        id:
          type: string
          format: uuid
          description: The row's stable id, used to correct it.
        rowNumber:
          type: integer
          format: int32
          description: The row's position among the transaction rows, from 1, not counting the header.
        reference:
          type: string
        transactionDate:
          type: string
        accountNumber:
          type: string
        description:
          type: string
        amount:
          type: string
        transactionType:
          type: string
        currency:
          type: string
        reasons:
          type: array
          description: Every reason the row failed (FP-04).
          items:
            type: string
          example: [Invalid Transaction Type, Missing Account Number]
    InvalidRowList:
      type: object
      required: [totalCount, rows]
      properties:
        totalCount:
          type: integer
          format: int32
          description: How many invalid rows remain.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/InvalidRow'
    RowCorrection:
      type: object
      description: >-
        The corrected values of one invalid row. All seven columns are given and replace the row's
        values; an empty string is an empty value.
      required: [id, reference, transactionDate, accountNumber, description, amount, transactionType, currency]
      properties:
        id:
          type: string
          format: uuid
          description: The id of the invalid row, as listed by `GET /files/{fileId}/invalid-rows`.
        reference:
          type: string
        transactionDate:
          type: string
        accountNumber:
          type: string
        description:
          type: string
        amount:
          type: string
        transactionType:
          type: string
        currency:
          type: string
    RowCorrections:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          description: The corrected rows, each at most once.
          items:
            $ref: '#/components/schemas/RowCorrection'
    RecheckRequest:
      type: object
      required: [corrections]
      properties:
        corrections:
          type: array
          description: >-
            Corrected rows to save before checking again, each at most once. May be empty to check
            again with the values already saved.
          items:
            $ref: '#/components/schemas/RowCorrection'
    RecheckResult:
      type: object
      description: >-
        The outcome of checking a file again: its new status (Completed or Failed), its details as
        `GET /files/{fileId}` returns them, and `invalidRows`, the rows that still fail and how many
        remain (empty, with a count of 0, when the file loaded and is Completed).
      required: [status, file, invalidRows]
      properties:
        status:
          $ref: '#/components/schemas/FileStatus'
        file:
          $ref: '#/components/schemas/FileDetails'
        invalidRows:
          $ref: '#/components/schemas/InvalidRowList'
    ValidationProblem:
      type: object
      description: RFC 7807 validation problem details, with the failing fields under `errors`.
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
security:
  - sessionCookie: []
