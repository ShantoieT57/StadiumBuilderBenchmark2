openapi: 3.0.3
info:
  title: TransactionApi
  version: 1.0.0
  description: >-
    REST API for the Transaction Import and Approval app. Every endpoint requires
    a signed-in session (sent as the HttpOnly `txn_session` cookie) unless it is
    explicitly marked as anonymous. A person can be signed in in one place at a
    time, and a session ends after a period of inactivity (60 minutes by default);
    any authenticated request resets that period, except opening or holding the
    live event stream (`GET /events`). When a request is refused with
    401, the `reason` in the response says why, so the caller can tell an expired
    session or a sign-in elsewhere from never having signed in. When a signed-in
    person's role does not allow an endpoint, the request is refused with 403.
    A request with invalid input is refused with 400 and a `ValidationProblem`, whose
    `errors` are keyed by the camelCase names the client sends, exactly as in the JSON
    (see `ValidationProblem` for the convention).
servers:
  - url: http://localhost:5100/api
tags:
  - name: Authentication
    description: Signing in, identifying the signed-in person, and signing out.
  - name: Files
    description: Uploading transaction files (importers only), listing files, a file's details, original content and invalid rows, correcting and re-checking a file (importers only), and cancelling a file (importers only).
  - name: Dashboard
    description: The figures shown above the dashboard's file list.
  - name: Transactions
    description: >-
      Listing, searching and filtering transactions, a transaction's details, the number of
      transactions still Imported (approvers only), approving or rejecting a transaction
      (approvers only), and exporting transactions to CSV (approvers only). Transactions of cancelled files are removed when the file is cancelled and
      never appear here.
  - name: Events
    description: >-
      A live stream of change notifications (Server-Sent Events), so screens such as the
      dashboard, a file's details and the approvals badge can update without refreshing or polling.
paths:
  /events:
    get:
      tags: [Events]
      operationId: StreamEvents
      summary: Stream live change notifications as Server-Sent Events (both roles).
      description: >-
        Opens a `text/event-stream` (Server-Sent Events) that stays open and announces changes as
        they are committed, by any instance of the app or any process that writes to the database.
        Events are lightweight invalidation hints, not data: on an event, the caller re-fetches the
        affected endpoints (e.g. the dashboard summary, the file list, the file's details, the
        transactions list and the Imported count).


        **Format.** Each event is sent as `id`, `event` and `data` fields followed by a blank line,
        e.g. `id: 42` / `event: file-changed` / `data: {"fileId":"…","status":"Processing","isCancelled":false}`.
        `data` is always one line of JSON. Event ids increase within a stream. The stream starts
        with a `retry: 5000` field (reconnect after 5 seconds).


        **Event types.**

        - `file-changed` (`FileChangedEvent`): a file was uploaded, its status changed (Uploaded,
          Processing, Completed, Failed), corrections to its invalid rows were saved, a re-check
          finished (even if the file stays Failed) or the file was cancelled.

        - `transactions-changed` (`TransactionsChangedEvent`): transactions of the file were
          loaded (by processing or a re-check), approved, rejected or removed by cancelling the file.
          A cancel of a file that has transactions therefore sends both `file-changed` and
          `transactions-changed`.

        - `resync` (`ResyncEvent`): the server lost its database connection and reconnected, so
          changes in between may have been missed; the caller re-fetches everything it shows.

        - `session-ended` (`SessionEndedEvent`): the caller's session has ended, after which the
          server closes the stream. `reason` is `SessionExpired`, `SignedInElsewhere` or `SignedOut`
          (as in a 401), so the caller can return the person to the sign-in screen with the same
          message.


        **Heartbeats.** A comment line (`: heartbeat`) is sent every `EventStreamHeartbeatSeconds`
        (15 seconds by default) so proxies keep the connection open. The session is checked at every
        heartbeat, so a stream ends within one heartbeat interval of its session expiring, being
        replaced by a sign-in elsewhere (SI-07) or being signed out (SI-08).


        **Session activity.** Opening the stream, keeping it open and receiving heartbeats or
        events do not count as activity: they never reset the session's inactivity timeout (SI-06).


        **Visibility.** Importers and approvers may both see every file and transaction, so every
        signed-in person receives every event; there is no per-role filtering.


        **Reconnecting.** Events are not replayed: `Last-Event-ID` is ignored. After the stream
        opens or re-opens (including after a `resync`), the caller re-fetches what it shows. The
        server closes the stream when it shuts down and when the caller falls too far behind in
        reading events; the caller simply reconnects.
      responses:
        '200':
          description: >-
            The event stream. It stays open until the session ends, the caller disconnects, the
            caller falls too far behind, or the server stops.
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /transactions:
    get:
      tags: [Transactions]
      operationId: ListTransactions
      summary: List transactions one page at a time, sorted and filtered (TL-01..TL-03, TL-08, SF-01, SF-02, SF-04).
      description: >-
        Returns one page of transactions with the total number of transactions that match the
        filters. Available to every signed-in person. Only transactions of files that are not
        cancelled are ever listed.


        Sorting: by default the most recent transaction date comes first. Any column can be sorted
        on, one at a time, ascending or descending. Text columns sort ignoring upper and lower case.
        Transactions with the same value in the sorted column are ordered by their reference
        (ignoring case, unique across the app), in the same direction, so the order is total and
        stays the same while paging (TL-02).


        Filtering (SF-01): every filter is optional and all filters combine (SF-02); a transaction
        must match every filter given. The same filters and sort are applied by the export (EX-01).


        Empty lists: when nothing is listed, `items` is empty and `totalCount` is 0.
        `hasAnyTransactions` tells "No transactions yet" (false, TL-08) apart from "no transactions
        match the filters" (true, SF-04) without a second request.


        Unknown or invalid query values are refused with 400, naming the failing parameter.
      parameters:
        - name: page
          in: query
          required: false
          description: The 1-based page number. A page past the last page is empty.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: The number of transactions per page; one of 5, 10, 20 or 50 (TL-03).
          schema:
            type: integer
            format: int32
            default: 20
        - $ref: '#/components/parameters/TransactionSortBy'
        - $ref: '#/components/parameters/TransactionSortDirection'
        - $ref: '#/components/parameters/TransactionStatusFilter'
        - $ref: '#/components/parameters/TransactionFileIdFilter'
        - $ref: '#/components/parameters/TransactionDateFrom'
        - $ref: '#/components/parameters/TransactionDateTo'
        - $ref: '#/components/parameters/TransactionMinAmount'
        - $ref: '#/components/parameters/TransactionMaxAmount'
        - $ref: '#/components/parameters/TransactionSearch'
      responses:
        '200':
          description: One page of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          description: >-
            A query value is invalid: an unknown sort column, sort direction or status, a file id
            that is not a UUID, a page below 1, a page size other than 5, 10, 20 or 50, a date that
            cannot be read or has a time-zone offset, `dateFrom` later than `dateTo`, an amount that
            is not a number or is negative, or `minAmount` greater than `maxAmount`. The failing
            query parameters are listed under `errors`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /transactions/export:
    get:
      tags: [Transactions]
      operationId: ExportTransactions
      summary: Export the filtered, sorted transactions as a CSV file (EX-01..EX-06, approvers only).
      description: >-
        Returns every transaction that matches the filters, across all pages, as a CSV attachment
        (EX-01). Takes exactly the same filter and sort parameters as `GET /transactions`, validated
        the same way and refused with the same 400s; with no filters every transaction is exported
        (EX-02). Rows are in the same order as the list with the same sort: by default the most
        recent transaction date first. There is no paging: `page` and `pageSize` are not parameters
        of this operation and are ignored when sent. Only transactions of files that are not
        cancelled are ever exported (FX-03). Importers are refused with 403 (TL-05). Rows are
        streamed, so a large export is never held in memory.


        Columns (EX-03), after a header row with these exact names, in this order: `Reference`,
        `Transaction Date`, `Account Number`, `Description`, `Amount`, `Currency`, `Type` (`Credit`
        or `Debit`), `Status`, `File`, `Rejection Reason` (empty unless Rejected), `Last Changed By`
        (`System` for a loaded transaction) and `Last Changed On`.


        Format (EX-06), so the file opens cleanly in a spreadsheet such as Excel: UTF-8 with a
        byte-order mark; every record, including the last, ends with CR LF; fields are quoted as in
        RFC 4180 (a field holding a comma, a double quote, a CR or an LF is enclosed in double
        quotes, and each double quote inside it is doubled; line breaks inside a field are kept as
        they are). `Amount` always has exactly two decimals and a dot, with no thousands separators
        and no sign (e.g. `15750.00`). `Transaction Date` is the local date and time exactly as in
        the file, with no time zone, as `yyyy-MM-dd HH:mm:ss` followed by the fraction of a second
        only when there is one (e.g. `2026-04-15 08:30:00`, `2026-04-14 17:05:30.25`).
        `Last Changed On` is given to the second as `yyyy-MM-dd HH:mm:ss` in the export time zone
        (the `ExportTimeZone` app setting, an IANA time-zone id, `Africa/Johannesburg` (SAST,
        UTC+02:00) by default).


        Formula injection (OWASP CSV injection): a text cell (`Reference`, `Account Number`,
        `Description`, `Currency`, `File`, `Rejection Reason`, `Last Changed By`) whose value
        starts with `=`, `+`, `-`, `@`, a tab or a carriage return is written with a leading
        apostrophe (`'`), so a spreadsheet shows it as text and never runs it as a formula. Other
        cells are never altered; `Amount` is never negative.


        File name (EX-04): `transactions_[<filters>_]<export date>.csv`, sent in
        `Content-Disposition` as `attachment` with both `filename` and, UTF-8 encoded, `filename*`
        (RFC 6266 / RFC 5987). The export date is today's date (`yyyy-MM-dd`) in the export time
        zone, so just after midnight in Johannesburg is already the next day even though it is
        still the previous day in UTC. Each active filter adds one part, always in this order,
        separated by `_`:

          1. status: the status itself, e.g. `Imported`;
          2. file: `file-<file name>`, the file's name without its `.csv` extension;
          3. transaction dates: `from-<start>-to-<end>`, `from-<start>` or `to-<end>`, each written
             as `yyyy-MM-dd` when it is a whole day (the start of the day for `dateFrom`, the end of
             the day for `dateTo`), otherwise as `yyyy-MM-ddTHHmm`, with `ss` added when the seconds
             are not zero;
          4. amounts: `amount-<min>-to-<max>`, `amount-from-<min>` or `amount-to-<max>`, each
             written with a dot and without trailing zeros (e.g. `100`, `200.5`);
          5. search: `search-<text>`.

        File names and search text are made safe for every file system: each run of characters
        other than letters, digits, `-` and `.` (spaces and `\ / : * ? " < > |` among them) becomes
        one `-`, leading and trailing `-` and `.` are removed, and the result is cut to at most 40
        characters; when nothing is left, the part is just `file` or `search`. For example
        `transactions_2026-04-15.csv` with no filters, `transactions_Imported_2026-04-15.csv`, and
        `transactions_Rejected_file-April-Batch-1_from-2026-04-01-to-2026-04-30_amount-from-100_search-INV_2026-04-15.csv`.
        The whole name stays well within 255 characters.
      parameters:
        - $ref: '#/components/parameters/TransactionSortBy'
        - $ref: '#/components/parameters/TransactionSortDirection'
        - $ref: '#/components/parameters/TransactionStatusFilter'
        - $ref: '#/components/parameters/TransactionFileIdFilter'
        - $ref: '#/components/parameters/TransactionDateFrom'
        - $ref: '#/components/parameters/TransactionDateTo'
        - $ref: '#/components/parameters/TransactionMinAmount'
        - $ref: '#/components/parameters/TransactionMaxAmount'
        - $ref: '#/components/parameters/TransactionSearch'
      responses:
        '200':
          description: >-
            The matching transactions as a CSV file, sent with the content type
            `text/csv; charset=utf-8`.
          headers:
            Content-Disposition:
              description: >-
                `attachment` with the export's file name, e.g.
                `attachment; filename=transactions_Imported_2026-04-15.csv; filename*=UTF-8''transactions_Imported_2026-04-15.csv`.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            A query value is invalid, exactly as for `GET /transactions`: an unknown sort column,
            sort direction or status, a file id that is not a UUID, a date that cannot be read or
            has a time-zone offset, `dateFrom` later than `dateTo`, an amount that is not a number
            or is negative, or `minAmount` greater than `maxAmount`. The failing query parameters
            are listed under `errors`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            Nothing matches, so there is nothing to export (EX-05). With filters, the `message` is
            "No transactions match the current filters, so there is nothing to export."; with no
            filters and no transactions at all, it is "There are no transactions yet, so there is
            nothing to export." 409 is used, as elsewhere in this API, because the request is valid
            but the current data does not allow it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /transactions/imported-count:
    get:
      tags: [Transactions]
      operationId: GetImportedTransactionCount
      summary: Get how many transactions are still Imported, for the menu badge (TL-07, approvers only).
      description: >-
        Counts the transactions still Imported over every file that is not cancelled. The raw
        number is returned; showing "99+" above 99 and nothing at zero is up to the caller.
      responses:
        '200':
          description: The number of Imported transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportedTransactionCount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /transactions/{transactionId}:
    get:
      tags: [Transactions]
      operationId: GetTransaction
      summary: Get all of a transaction's details (TL-06).
      description: >-
        Returns every field of the transaction, the file it came from, who created it and when,
        who last changed it and when, and its rejection reason (only on a Rejected transaction).
        Available to every signed-in person.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The transaction's details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetails'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
  /transactions/{transactionId}/approve:
    post:
      tags: [Transactions]
      operationId: ApproveTransaction
      summary: Approve an Imported transaction (AP-02..AP-04, TS-02..TS-04, approvers only).
      description: >-
        Changes the transaction's status from Imported to Approved, records the signed-in approver's
        name as `lastChangedBy` and the current time as `lastChangedAt` (AP-03), and returns the
        transaction's details as `GET /transactions/{transactionId}` now returns them, so the caller
        can update the list straight away and confirm the approval (AP-02). The request has no body;
        asking the person to confirm, naming the reference (AP-01), is up to the caller.


        Only an Imported transaction can be approved; Approved and Rejected are final (TS-02, TS-03).
        If the transaction is no longer Imported, for example because someone else approved or
        rejected it first, nothing is changed and the request is refused with 409, with the
        transaction's current details (AP-04). Two requests to approve or reject the same transaction
        at the same moment change it exactly once; the other is refused with 409.


        An approval and a cancel of the transaction's file never overlap: whichever comes second
        waits for the first. An approval that comes first stands, and the cancel is then refused
        because the file has an Approved transaction (FX-02); a cancel that comes first removes the
        transaction, and the approval is then refused with 404.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The transaction is now Approved; its details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetails'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
        '409':
          $ref: '#/components/responses/TransactionAlreadyReviewed'
  /transactions/{transactionId}/reject:
    post:
      tags: [Transactions]
      operationId: RejectTransaction
      summary: Reject an Imported transaction with a reason (RJ-01..RJ-05, TS-02..TS-04, approvers only).
      description: >-
        Changes the transaction's status from Imported to Rejected, stores the reason with it,
        records the signed-in approver's name as `lastChangedBy` and the current time as
        `lastChangedAt` (RJ-04), and returns the transaction's details as
        `GET /transactions/{transactionId}` now returns them, so the caller can update the list
        straight away and confirm the rejection (RJ-03). The stored reason cannot be edited.


        The reason is required (RJ-01) and may be at most 500 characters (RJ-02). Whitespace at the
        start and end of the reason is removed before it is checked and stored; a reason that is
        missing, empty or only whitespace is refused with 400, as is one that is longer than 500
        characters once trimmed. Characters are counted as UTF-16 code units, the same as a
        JavaScript string's `length`, so a character outside the Basic Multilingual Plane (such as
        an emoji) counts as 2. A reason the caller limits to 500 characters as typed is therefore
        always accepted.


        Only an Imported transaction can be rejected, and the same rules as approving apply when it
        is no longer Imported (409 with its current details, RJ-05), when two requests act on it at
        the same moment, and when its file is being cancelled. The reason is checked before the
        transaction, so an invalid reason is refused with 400 whatever the transaction's status.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectTransactionRequest'
      responses:
        '200':
          description: The transaction is now Rejected; its details, with the stored reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetails'
        '400':
          description: >-
            The reason is missing, empty, only whitespace, or longer than 500 characters. The
            problem is listed under the key `Reason` in `errors` (validation errors about a request
            body name its fields by their model property names). Nothing is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
        '409':
          $ref: '#/components/responses/TransactionAlreadyReviewed'
  /dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: GetDashboardSummary
      summary: Get the number of files and of transactions in each status.
      description: >-
        Counts the files in each status, and the transactions that are Imported,
        Approved and Rejected, over every file that is not cancelled (DB-01).
        Available to every signed-in person.
      responses:
        '200':
          description: The dashboard figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/sign-in:
    post:
      tags: [Authentication]
      operationId: SignIn
      summary: Sign in with email address and password (anonymous).
      description: >-
        Starts a server-side session and returns it as the HttpOnly `txn_session`
        cookie. A person can be signed in in one place at a time, so any other
        active session of the same person is ended; its cookie is then refused
        with the reason `SignedInElsewhere`. A wrong email address and a wrong
        password both return the same 401 response, so the caller can never tell
        which of the two was wrong.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in. The session cookie is set and the signed-in person is returned.
          headers:
            Set-Cookie:
              description: The HttpOnly `txn_session` session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          description: The email address or password is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: The email address or password is wrong ("Invalid email or password").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: GetCurrentUser
      summary: Get the person who is signed in with the current session.
      description: >-
        Like every authenticated request, this counts as activity and resets the
        session's inactivity timeout.
      responses:
        '200':
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/sign-out:
    post:
      tags: [Authentication]
      operationId: SignOut
      summary: Sign out on every device (anonymous, idempotent).
      description: >-
        When the `txn_session` cookie identifies an active session, ends every
        active session of that person, so they are signed out on every device;
        the other devices' cookies are then refused with the reason `SignedOut`.
        Always clears the cookie and always succeeds, even when there is no valid
        session (in which case no other session is affected).
      security: []
      responses:
        '204':
          description: Signed out. The session cookie is cleared.
  /files:
    get:
      tags: [Files]
      operationId: ListFiles
      summary: List files one page at a time, sorted and filtered (DB-02..DB-06).
      description: >-
        Returns one page of files with the total number of files that match the
        filters. Available to every signed-in person. By default the most recently
        processed file comes first. A file that has not been processed yet has no
        `lastProcessedAt` (null) and counts as more recent than any processed file,
        so files waiting to be processed come first. Any column can be sorted on,
        one at a time. Files with the same value in the sorted column are ordered
        by the order in which they were received (in the same direction), so
        paging is deterministic. Values that are not known yet (null) sort after
        every other value in ascending order and before them in descending order.
        All filters combine. An empty result is an empty `items` list with a
        `totalCount` of 0. Unknown or invalid query values are refused with 400.
      parameters:
        - name: page
          in: query
          required: false
          description: The 1-based page number. A page past the last page is empty.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: The number of files per page; one of 5, 10, 20 or 50.
          schema:
            type: integer
            format: int32
            default: 20
        - name: sortBy
          in: query
          required: false
          description: The column to sort on. Defaults to `LastProcessedAt`.
          schema:
            $ref: '#/components/schemas/FileSortColumn'
        - name: sortDirection
          in: query
          required: false
          description: >-
            The sort direction. Defaults to `Desc` when sorting on `LastProcessedAt`
            (the default column), and to `Asc` for every other column.
          schema:
            $ref: '#/components/schemas/SortDirection'
        - name: status
          in: query
          required: false
          description: Lists only the files with this status.
          schema:
            $ref: '#/components/schemas/FileStatus'
        - name: fileName
          in: query
          required: false
          description: >-
            Lists only the files whose name contains this text, ignoring upper and
            lower case. Every character is matched literally (no wildcards).
          schema:
            type: string
        - name: processedFrom
          in: query
          required: false
          description: >-
            Lists only the files last processed at or after this date and time
            (inclusive). A file that has not been processed yet never matches a
            process-date filter. To filter by whole days, send the start of the
            first day in the person's time zone, e.g. `2026-04-15T00:00:00+02:00`
            (URL-encode the `+` as `%2B`).
          schema:
            type: string
            format: date-time
        - name: processedTo
          in: query
          required: false
          description: >-
            Lists only the files last processed at or before this date and time
            (inclusive). To filter by whole days, send the end of the last day in
            the person's time zone, e.g. `2026-04-15T23:59:59.999+02:00`. Must not
            be earlier than `processedFrom`.
          schema:
            type: string
            format: date-time
        - name: visibility
          in: query
          required: false
          description: Which files to list by whether they are cancelled. Defaults to `Active` (DB-06).
          schema:
            $ref: '#/components/schemas/FileVisibility'
      responses:
        '200':
          description: One page of files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePage'
        '400':
          description: >-
            A query value is invalid: an unknown sort column, sort direction,
            status or visibility, a page below 1, a page size other than 5, 10,
            20 or 50, a date and time that cannot be read, or `processedFrom`
            later than `processedTo`. The failing query parameters are listed
            under `errors`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Files]
      operationId: UploadFile
      summary: Upload a transaction file (importers only).
      description: >-
        Hands a file over for processing and returns at once with the status
        `Uploaded`. The exact original bytes are kept. Checking and loading the
        file happen afterwards, in the background. Only `.csv` files are accepted
        (the extension is matched regardless of upper and lower case). The file
        name must not be empty, must be 255 characters or fewer, and must not
        contain `..`, `\`, `/` or `:`. Files larger than the configured maximum
        upload size (10 MB by default) are refused with 413.


        The request must be `multipart/form-data` with exactly one file, sent in
        the form field `file`. A part counts as a file when its
        `Content-Disposition` has a `filename` (or `filename*`) parameter, even an
        empty one, so a part sent with `filename=""` is a file without a name
        and is refused with "Invalid file name" whatever its size up to the
        maximum upload size. A plain form field named `file` (with no
        `filename`) is likewise treated as a file without a name.


        A refused request never stores anything. The checks are made in this
        order, and the first one that fails decides the response: (1) not
        signed in (401) or not an importer (403); (2) the request is not
        `multipart/form-data` (415); (3) the multipart body cannot be read, e.g.
        it has no boundary or ends before its closing boundary (400); (4) any
        part of the request, including a file without a name, is larger than
        the maximum upload size (413); (5) more than one file is sent (400);
        (6) no file is sent in the field `file`, e.g. the only file is sent
        under another field name, or the file kind is unknown (400, validation
        problem); (7) the file name is invalid (400); (8) the file is not a
        `.csv` file (400).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload, with its original file name.
                kind:
                  $ref: '#/components/schemas/FileKind'
      responses:
        '201':
          description: The file has been received and is waiting to be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
        '400':
          description: >-
            The multipart body cannot be read ("The upload request could not be
            read. Please send the file as multipart/form-data."), more than one
            file is sent ("Upload one file at a time."), the file name is invalid
            ("Invalid file name", also for a file sent with an empty name), the
            file is not a `.csv` file ("Only .csv files can be uploaded. Please
            choose a .csv file."), the file is missing from the field `file`, or
            the file kind is unknown. An unreadable body, more than one file, a
            refused file name or a refused file type is described by `message`;
            a missing file or unknown kind is reported as a validation problem
            (under `file` or `kind`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: >-
            The file, or any other part of the request (including a file sent
            with an empty name), is larger than the maximum upload size, or the
            request body as a whole is larger than the maximum upload size plus
            64 KB: "The file is too large. Files can be up to 10 MB." (the size
            named is the configured maximum).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: >-
            The request is not `multipart/form-data`, e.g. it is sent as
            `application/json`, as `application/x-www-form-urlencoded` or without
            a `Content-Type`: "Files must be uploaded as multipart/form-data."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /files/{fileId}:
    get:
      tags: [Files]
      operationId: GetFile
      summary: Get a file's details and processing history (FD-01, FD-03, FD-04, FD-06, FD-07).
      description: >-
        Returns everything the file's detail screen shows, including its processing history, in one
        response. Available to every signed-in person, for active and cancelled files alike.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: The file's details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDetails'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FileNotFound'
  /files/{fileId}/content:
    get:
      tags: [Files]
      operationId: DownloadFile
      summary: Download the original file exactly as it was uploaded (FD-05).
      description: >-
        Returns the exact bytes that were uploaded, unchanged (including any byte-order mark and the
        original line endings), as `text/csv` with no charset, since the file's encoding is never
        assumed. The `Content-Disposition` header is `attachment` and carries the original file name
        both as `filename` and, encoded as UTF-8, as `filename*` (RFC 6266 / RFC 5987), so names
        with spaces or non-ASCII characters survive. Available to every signed-in person. Once a
        file has been cancelled, the app's copy of the original is discarded (FX-04) and the
        download is refused with 410 Gone, so a caller can tell a file that no longer has its
        original from a file that never existed (404).
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: The original file.
          headers:
            Content-Disposition:
              description: '`attachment` with the original file name, e.g. `attachment; filename=transactions_2026-04-15.csv; filename*=UTF-8''''transactions_2026-04-15.csv`.'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '410':
          description: >-
            The original file is no longer available because the file has been cancelled and its
            content discarded (FX-04).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /files/{fileId}/invalid-rows:
    get:
      tags: [Files]
      operationId: ListInvalidRows
      summary: List the invalid rows of a file waiting for corrections (FC-01, importers only).
      description: >-
        Lists only the invalid rows, in file order, each with a stable row id (used to correct the
        row), its row number (counting transaction rows from 1, not counting the header), every
        column value exactly as it was in the file and every reason it failed (FP-04). `totalCount`
        is how many invalid rows remain. Only a file that is Failed because of invalid rows and is
        not cancelled is waiting for corrections; for any other file the request is refused with
        409, so a caller never mistakes "nothing to correct" for "no invalid rows left".
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: The invalid rows still to be corrected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRowList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '409':
          $ref: '#/components/responses/NotWaitingForCorrections'
    patch:
      tags: [Files]
      operationId: SaveCorrections
      summary: Save corrected values on invalid rows without checking the file again (FC-02, importers only).
      description: >-
        Replaces the values of one or more invalid rows, identified by their row ids, with the values
        given, without checking the file again. Every one of the seven columns is replaced, so send
        the row's full set of values (an empty string for an empty value). A corrected row always has
        exactly the seven expected columns, so any surplus values the row had in the file are dropped.
        The rows keep the reasons found by the last check until the file is checked again
        (`POST /files/{fileId}/recheck`), so they stay invalid and can be corrected again. All the
        corrections are saved together or not at all. Only the file's invalid rows can be corrected.
        The original uploaded file is never changed (FD-05).
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RowCorrections'
      responses:
        '200':
          description: The invalid rows, with the saved values and the reasons from the last check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRowList'
        '400':
          $ref: '#/components/responses/InvalidCorrections'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '409':
          $ref: '#/components/responses/NotWaitingForCorrections'
  /files/{fileId}/recheck:
    post:
      tags: [Files]
      operationId: RecheckFile
      summary: Save any corrections and check the file again (FC-02, FC-03, FS-02, importers only).
      description: >-
        Saves the corrected values given for invalid rows (as `PATCH /files/{fileId}/invalid-rows`
        does) and then checks the file again, all in one database transaction, and returns the
        outcome straight away. `corrections` may be empty to check the file again with the values
        already saved.


        Checking again repeats stages 4 to 7 (Convert types, Check rows, then Wait for corrections or
        Load) over every row of the file, including the rows that were already valid, using the
        corrected values; so a correction can also clear or cause "Duplicate Reference In File" on
        other rows. The duplicate-file check is not repeated. The open Wait for corrections stage is
        finished and the new stages are added to the processing history.


        If every row now passes, the file is loaded as in stage 7 (status Imported, created by
        "System", rows whose reference already exists ignoring case are skipped and rows with an
        empty reference are ignored), the loaded / skipped / ignored counts are stored and the file
        becomes Completed. If any row still fails, nothing is loaded, the file stays Failed (invalid
        rows) with its failure reason updated to the new count, and `invalidRows` lists the rows that
        still fail and how many remain. Either way the file's last processed time is updated.


        Only one correction or re-check of a file runs at a time: a request made while another is
        under way waits for it and is then refused with 409 if the file is no longer waiting for
        corrections. The original uploaded file is never changed (FD-05).
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecheckRequest'
      responses:
        '200':
          description: The file was checked again; `status` says whether it loaded or still has invalid rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecheckResult'
        '400':
          $ref: '#/components/responses/InvalidCorrections'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '409':
          $ref: '#/components/responses/NotWaitingForCorrections'
  /files/{fileId}/cancel:
    post:
      tags: [Files]
      operationId: CancelFile
      summary: Cancel a file (FX-01..FX-06, FC-04, FD-08, importers only).
      description: >-
        Cancels the file and returns its details as `GET /files/{fileId}` returns them. The request
        has no body; asking the person to confirm, naming the file (FX-01), is up to the caller.


        A file with at least one Approved transaction cannot be cancelled and is refused with 409
        (FX-02); nothing changes. Imported and Rejected transactions do not prevent cancelling.


        Cancelling, all in one database transaction: removes the file's transactions, so they no
        longer appear in any list, summary or export, and a corrected file with the same references
        can be uploaded and loaded later (FX-03); discards the app's copy of the original file, so
        the download answers 410 (FX-04); stops a file waiting for corrections from waiting, by
        finishing its open Wait for corrections stage and discarding the rows kept for corrections
        (FX-04); records when the file was cancelled and by whom, and adds a `Cancelled` entry to the
        processing history. A cancelled file no longer counts in the dashboard summary and is hidden
        from the file list by default (FX-05, DB-06), and it no longer counts as an earlier file in
        the duplicate check (FP-01), so the same content can be uploaded again and loaded.


        A file can be cancelled whatever its status (Uploaded, Processing, Completed, or Failed as a
        duplicate or because of invalid rows) and keeps that status, except that a file that has
        been claimed for processing but whose processing has not started returns to Uploaded. A file
        that is being processed is cancelled once its processing has finished (the request waits for
        it), so the outcome of processing is never half undone. A cancelled file is never processed,
        corrected or checked again. A correction or re-check under way when the file is cancelled
        finishes first; one that starts after it is refused with 409.


        Cancelling a file that is already cancelled, by anyone, changes nothing and returns its
        details showing it cancelled, with the original cancel time and person (FX-06).
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: The file is cancelled (now, or already before); its details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDetails'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '409':
          description: >-
            The file has at least one Approved transaction, so it cannot be cancelled (FX-02). The
            `message` explains why and says how many transactions have been approved, e.g. "This
            file cannot be cancelled because 3 of its transactions have been approved." Nothing is
            changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    FileId:
      name: fileId
      in: path
      required: true
      description: The file's id.
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transactionId
      in: path
      required: true
      description: The transaction's id.
      schema:
        type: string
        format: uuid
    # The transaction filter and sort parameters, shared by the transactions list and the export so
    # both select exactly the same transactions in the same order (EX-01).
    TransactionSortBy:
      name: sortBy
      in: query
      required: false
      description: The column to sort on. Defaults to `TransactionDate`.
      schema:
        $ref: '#/components/schemas/TransactionSortColumn'
    TransactionSortDirection:
      name: sortDirection
      in: query
      required: false
      description: >-
        The sort direction. Defaults to `Desc` when sorting on `TransactionDate` (the default
        column, most recent first), and to `Asc` for every other column.
      schema:
        $ref: '#/components/schemas/SortDirection'
    TransactionStatusFilter:
      name: status
      in: query
      required: false
      description: Selects only the transactions with this status (DB-01, FD-02).
      schema:
        $ref: '#/components/schemas/TransactionStatus'
    TransactionFileIdFilter:
      name: fileId
      in: query
      required: false
      description: >-
        Selects only the transactions loaded from this file (FD-02). An id that is not a file, or
        a cancelled file, matches nothing.
      schema:
        type: string
        format: uuid
    TransactionDateFrom:
      name: dateFrom
      in: query
      required: false
      description: >-
        Selects only the transactions dated on or after this point (inclusive). Transaction dates
        are local dates and times exactly as written in the file, with no time zone, so this
        value has no time zone either. Either a date (`2026-04-15`), meaning from the start of
        that day, or a date and time (`2026-04-15T08:30`, `2026-04-15T08:30:00` or with a
        fraction of a second; times are compared to the microsecond, and any finer fraction is
        ignored). A value with a time-zone offset or `Z` is refused.
      schema:
        type: string
        example: '2026-04-15'
    TransactionDateTo:
      name: dateTo
      in: query
      required: false
      description: >-
        Selects only the transactions dated on or before this point (inclusive), in the same
        forms as `dateFrom`. A date (`2026-04-30`) means up to and including the whole of that
        day; a date and time means up to and including that moment. Must not be earlier than
        `dateFrom`.
      schema:
        type: string
        example: '2026-04-30'
    TransactionMinAmount:
      name: minAmount
      in: query
      required: false
      description: >-
        Selects only the transactions with an amount of at least this value (inclusive). A
        decimal number of 0 or more, e.g. `100` or `100.50`.
      schema:
        type: number
        format: decimal
        minimum: 0
    TransactionMaxAmount:
      name: maxAmount
      in: query
      required: false
      description: >-
        Selects only the transactions with an amount of at most this value (inclusive). A decimal
        number of 0 or more, not less than `minAmount`.
      schema:
        type: number
        format: decimal
        minimum: 0
    TransactionSearch:
      name: search
      in: query
      required: false
      description: >-
        Selects only the transactions whose reference or account number contains this text,
        ignoring upper and lower case. Every character is matched literally (`%` and `_` are
        not wildcards). Leading and trailing spaces are ignored; an empty value is no filter.
      schema:
        type: string
  responses:
    TransactionNotFound:
      description: No transaction has this id ("Transaction not found"), or its file has been cancelled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TransactionAlreadyReviewed:
      description: >-
        The transaction is no longer Imported, so it was not changed (TS-02, TS-03, AP-04, RJ-05).
        `message` names its current status: "This transaction has already been approved." or "This
        transaction has already been rejected."; `transaction` holds its current details, so the
        caller can show its current status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionConflict'
    FileNotFound:
      description: No file has this id ("File not found").
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotWaitingForCorrections:
      description: >-
        The file is not waiting for corrections ("This file is not waiting for corrections."): it is
        not Failed because of invalid rows (for example it has already been loaded), or it has been
        cancelled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCorrections:
      description: >-
        The corrections cannot be applied. A row id that is not one of the file's invalid rows (a
        valid row, a row of another file or an unknown id) is refused with "Only the file's invalid
        rows can be corrected."; a row given more than once is refused with "Each row can be
        corrected only once in a request."; a missing value is reported as a validation problem.
        Nothing is saved.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - $ref: '#/components/schemas/ValidationProblem'
    Forbidden:
      description: >-
        The signed-in person's role does not allow this request. The `message`
        tells them they do not have access and to ask their administrator.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: >-
        There is no valid session. The `reason` says why, so the caller can show
        a suitable message on the sign-in screen.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthenticatedResponse'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: txn_session
  schemas:
    UserRole:
      type: string
      enum: [Importer, Approver]
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          example: fileimporter@digiata.com
        password:
          type: string
          minLength: 1
          format: password
          example: Test123
    CurrentUser:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          example: File Importer
        email:
          type: string
          example: fileimporter@digiata.com
        role:
          $ref: '#/components/schemas/UserRole'
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Invalid email or password
    UnauthenticatedReason:
      type: string
      description: >-
        Why a request was not authenticated. NotSignedIn - no session cookie, or
        one that was never issued. SessionExpired - the session ended after the
        inactivity timeout. SignedInElsewhere - the person signed in somewhere
        else, which ended this session. SignedOut - the session was ended by
        signing out (possibly on another device).
      enum: [NotSignedIn, SessionExpired, SignedInElsewhere, SignedOut]
    UnauthenticatedResponse:
      type: object
      required: [message, reason]
      properties:
        message:
          type: string
          example: Your session has expired after 60 minutes of inactivity. Please sign in again.
        reason:
          $ref: '#/components/schemas/UnauthenticatedReason'
    FileChangedEvent:
      type: object
      description: >-
        The `data` of a `file-changed` event on the event stream (`GET /events`): the file's status
        and whether it is cancelled after the change.
      required: [fileId, status, isCancelled]
      properties:
        fileId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/FileStatus'
        isCancelled:
          type: boolean
    TransactionsChangedEvent:
      type: object
      description: >-
        The `data` of a `transactions-changed` event on the event stream (`GET /events`): the file
        whose transactions were loaded, approved, rejected or removed.
      required: [fileId]
      properties:
        fileId:
          type: string
          format: uuid
    ResyncEvent:
      type: object
      description: >-
        The `data` of a `resync` event on the event stream (`GET /events`), always `{}`: changes may
        have been missed, so the caller re-fetches everything it shows.
    SessionEndedEvent:
      type: object
      description: >-
        The `data` of a `session-ended` event on the event stream (`GET /events`), the last event
        before the server closes the stream. The same as the body of a 401 for the ended session.
      required: [message, reason]
      properties:
        message:
          type: string
          example: Your session has expired after 60 minutes of inactivity. Please sign in again.
        reason:
          $ref: '#/components/schemas/UnauthenticatedReason'
    FileKind:
      type: string
      description: What kind of file is uploaded. There is one kind today.
      enum: [BankTransactions]
      default: BankTransactions
    FileStatus:
      type: string
      description: >-
        Uploaded - received and not yet checked. Processing - being checked or
        loaded. Completed - the transactions are loaded and ready for approval.
        Failed - a duplicate, or invalid rows are waiting for corrections.
      enum: [Uploaded, Processing, Completed, Failed]
    FailureKind:
      type: string
      description: >-
        Why a Failed file failed. Duplicate - it has the same content as an
        earlier file and stays failed (FS-01). InvalidRows - some rows are
        invalid and are waiting for corrections (FS-02).
      enum: [Duplicate, InvalidRows]
    FileSortColumn:
      type: string
      description: >-
        A column of the file list to sort on. `FileName` sorts ignoring upper and
        lower case. `Status` sorts in the order of a file's progress: Uploaded,
        Processing, Completed, Failed.
      enum: [FileName, LastProcessedAt, RowCount, Status, ImportedCount]
    SortDirection:
      type: string
      enum: [Asc, Desc]
    FileVisibility:
      type: string
      description: >-
        Active - only files that are not cancelled. Cancelled - only cancelled
        files. Both - every file.
      enum: [Active, Cancelled, Both]
    FileListItem:
      type: object
      required: [id, fileName, status, failureKind, failureReason, lastProcessedAt, rowCount, importedCount, isCancelled]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          example: transactions_2026-04-15.csv
        status:
          $ref: '#/components/schemas/FileStatus'
        failureKind:
          description: Why the file failed; null unless the status is Failed.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FailureKind'
        failureReason:
          type: string
          nullable: true
          description: The message describing why the file failed; null unless the status is Failed.
        lastProcessedAt:
          type: string
          format: date-time
          nullable: true
          description: When processing of the file last finished; null while it has never been processed.
        rowCount:
          type: integer
          format: int32
          nullable: true
          description: The number of transaction rows in the file; null until the file has been read.
        importedCount:
          type: integer
          format: int32
          description: How many of the file's transactions are still Imported.
        isCancelled:
          type: boolean
    FilePage:
      type: object
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileListItem'
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
          description: The number of files that match the filters, over every page.
        totalPages:
          type: integer
          format: int32
          description: The number of pages; 0 when no file matches.
    FileStatusCounts:
      type: object
      required: [uploaded, processing, completed, failed]
      properties:
        uploaded:
          type: integer
          format: int32
        processing:
          type: integer
          format: int32
        completed:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
    TransactionStatusCounts:
      type: object
      required: [imported, approved, rejected]
      properties:
        imported:
          type: integer
          format: int32
        approved:
          type: integer
          format: int32
        rejected:
          type: integer
          format: int32
    DashboardSummary:
      type: object
      description: Counts over every file that is not cancelled (DB-01).
      required: [files, transactions]
      properties:
        files:
          $ref: '#/components/schemas/FileStatusCounts'
        transactions:
          $ref: '#/components/schemas/TransactionStatusCounts'
    UploadedFile:
      type: object
      required: [id, fileName, kind, status, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          example: transactions_2026-04-15.csv
        kind:
          $ref: '#/components/schemas/FileKind'
        status:
          $ref: '#/components/schemas/FileStatus'
        uploadedAt:
          type: string
          format: date-time
    ProcessingStage:
      type: string
      description: >-
        A stage of processing a file, in the order they run. `Cancelled` is not a processing stage
        but an entry recording when the file was cancelled; it starts and finishes at that moment
        and is always the last entry.
      enum: [Receive, DuplicateCheck, ReadRows, ConvertTypes, CheckRows, WaitForCorrections, Load, Cancelled]
    ProcessingStageEntry:
      type: object
      required: [stage, startedAt, finishedAt]
      properties:
        stage:
          $ref: '#/components/schemas/ProcessingStage'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: When the stage finished; null while it is still under way (e.g. WaitForCorrections).
    FileDetails:
      type: object
      description: >-
        A file's details (FD-01, FD-03, FD-06, FD-07) and processing history (FD-04).
      required:
        - id
        - fileName
        - kind
        - status
        - failureKind
        - failureReason
        - uploadedBy
        - uploadedAt
        - lastProcessedAt
        - isCancelled
        - cancelledAt
        - cancelledBy
        - rowCount
        - loadedCount
        - skippedExistingCount
        - ignoredEmptyReferenceCount
        - transactions
        - isFullyReviewed
        - areTransactionsAvailable
        - canDownload
        - processingHistory
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          example: transactions_2026-04-15.csv
        kind:
          $ref: '#/components/schemas/FileKind'
        status:
          $ref: '#/components/schemas/FileStatus'
        failureKind:
          description: Why the file failed; null unless the status is Failed (FD-06).
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FailureKind'
        failureReason:
          type: string
          nullable: true
          description: The message describing why the file failed; null unless the status is Failed (FD-06).
        uploadedBy:
          type: string
          description: The name of the person who uploaded the file.
          example: File Importer
        uploadedAt:
          type: string
          format: date-time
        lastProcessedAt:
          type: string
          format: date-time
          nullable: true
          description: When processing of the file last finished; null while it has never been processed.
        isCancelled:
          type: boolean
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          description: When the file was cancelled; null unless it is cancelled.
        cancelledBy:
          type: string
          nullable: true
          description: >-
            The name of the person who cancelled the file; null unless it is cancelled (and for a
            file cancelled before this was recorded).
          example: File Importer
        rowCount:
          type: integer
          format: int32
          nullable: true
          description: The number of transaction rows in the file, not counting the header; null until the file has been read.
        loadedCount:
          type: integer
          format: int32
          nullable: true
          description: >-
            How many rows were loaded as transactions (FP-07). The three row counts are null until
            the file has been loaded (Completed) and then always add up to `rowCount`.
        skippedExistingCount:
          type: integer
          format: int32
          nullable: true
          description: How many rows were skipped because their reference already existed (FP-05, FP-07).
        ignoredEmptyReferenceCount:
          type: integer
          format: int32
          nullable: true
          description: How many rows were ignored because their reference was empty (FP-07).
        transactions:
          description: >-
            How many of the file's transactions are Imported, Approved and Rejected (FD-01). All zero
            while nothing has been loaded, for a failed file, and for a cancelled file (whose
            transactions are removed, FX-03).
          allOf:
            - $ref: '#/components/schemas/TransactionStatusCounts'
        isFullyReviewed:
          type: boolean
          description: >-
            True when the file is Completed, not cancelled, and none of its transactions is still
            Imported (FD-03). A Completed file with no transactions at all (every row skipped as
            existing or ignored for an empty reference) is fully reviewed, since nothing from it
            awaits review.
        areTransactionsAvailable:
          type: boolean
          description: >-
            False while the file is Uploaded or Processing, when its transactions are not available
            yet (FD-07); true once processing has finished (Completed or Failed).
        canDownload:
          type: boolean
          description: >-
            Whether the original file can still be downloaded (FD-05). False once the file is
            cancelled, because its copy of the original is discarded (FX-04).
        processingHistory:
          type: array
          description: Each stage the file has been through, in the order they ran (FD-04).
          items:
            $ref: '#/components/schemas/ProcessingStageEntry'
    InvalidRow:
      type: object
      description: An invalid row with every column value exactly as it was in the file.
      required: [id, rowNumber, reference, transactionDate, accountNumber, description, amount, transactionType, currency, reasons]
      properties:
        id:
          type: string
          format: uuid
          description: The row's stable id, used to correct it.
        rowNumber:
          type: integer
          format: int32
          description: The row's position among the transaction rows, from 1, not counting the header.
        reference:
          type: string
        transactionDate:
          type: string
        accountNumber:
          type: string
        description:
          type: string
        amount:
          type: string
        transactionType:
          type: string
        currency:
          type: string
        reasons:
          type: array
          description: Every reason the row failed (FP-04).
          items:
            type: string
          example: [Invalid Transaction Type, Missing Account Number]
    InvalidRowList:
      type: object
      required: [totalCount, rows]
      properties:
        totalCount:
          type: integer
          format: int32
          description: How many invalid rows remain.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/InvalidRow'
    RowCorrection:
      type: object
      description: >-
        The corrected values of one invalid row. All seven columns are given and replace the row's
        values; an empty string is an empty value.
      required: [id, reference, transactionDate, accountNumber, description, amount, transactionType, currency]
      properties:
        id:
          type: string
          format: uuid
          description: The id of the invalid row, as listed by `GET /files/{fileId}/invalid-rows`.
        reference:
          type: string
        transactionDate:
          type: string
        accountNumber:
          type: string
        description:
          type: string
        amount:
          type: string
        transactionType:
          type: string
        currency:
          type: string
    RowCorrections:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          description: The corrected rows, each at most once.
          items:
            $ref: '#/components/schemas/RowCorrection'
    RecheckRequest:
      type: object
      required: [corrections]
      properties:
        corrections:
          type: array
          description: >-
            Corrected rows to save before checking again, each at most once. May be empty to check
            again with the values already saved.
          items:
            $ref: '#/components/schemas/RowCorrection'
    RecheckResult:
      type: object
      description: >-
        The outcome of checking a file again: its new status (Completed or Failed), its details as
        `GET /files/{fileId}` returns them, and `invalidRows`, the rows that still fail and how many
        remain (empty, with a count of 0, when the file loaded and is Completed).
      required: [status, file, invalidRows]
      properties:
        status:
          $ref: '#/components/schemas/FileStatus'
        file:
          $ref: '#/components/schemas/FileDetails'
        invalidRows:
          $ref: '#/components/schemas/InvalidRowList'
    TransactionStatus:
      type: string
      description: >-
        Imported - loaded and waiting for review. Approved - approved by an approver (final).
        Rejected - rejected by an approver with a reason (final).
      enum: [Imported, Approved, Rejected]
    TransactionType:
      type: string
      enum: [Credit, Debit]
    TransactionSortColumn:
      type: string
      description: >-
        A column of the transactions list to sort on. `Reference`, `AccountNumber`,
        `Description`, `Currency` and `FileName` sort ignoring upper and lower case. `Amount` sorts
        by numeric value. `TransactionType` sorts Credit before Debit. `Status` sorts in the order
        of review: Imported, Approved, Rejected.
      enum: [TransactionDate, Reference, AccountNumber, Description, Amount, Currency, TransactionType, Status, FileName]
    TransactionFile:
      type: object
      description: The file a transaction was loaded from.
      required: [id, fileName]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          example: transactions_2026-04-15.csv
    TransactionListItem:
      type: object
      description: >-
        A transaction as shown in the transactions list (TL-01). `transactionDate` is the local
        date and time exactly as written in the file, with no time zone, as ISO 8601 without an
        offset (`yyyy-MM-ddTHH:mm:ss`, followed by a fraction of a second only when it has one).
        `amount` is a JSON number that always carries exactly two decimal places (e.g. `1500.00`),
        the exact stored value; parse it as a decimal rather than a floating-point number to keep
        it exact.
      required: [id, reference, transactionDate, accountNumber, description, amount, currency, transactionType, status, file]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: TXN-0001
        transactionDate:
          type: string
          example: '2026-04-15T08:30:00'
        accountNumber:
          type: string
          example: '1234567890'
        description:
          type: string
          example: Salary
        amount:
          type: number
          format: decimal
          example: 1500.00
        currency:
          type: string
          example: ZAR
        transactionType:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        file:
          $ref: '#/components/schemas/TransactionFile'
    TransactionPage:
      type: object
      required: [items, page, pageSize, totalCount, totalPages, hasAnyTransactions]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionListItem'
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
          description: The number of transactions that match the filters, over every page.
        totalPages:
          type: integer
          format: int32
          description: The number of pages; 0 when no transaction matches.
        hasAnyTransactions:
          type: boolean
          description: >-
            Whether any transaction exists at all, ignoring the filters. When nothing is listed,
            false means "No transactions yet" (TL-08) and true means that no transaction matches
            the filters (SF-04).
    TransactionDetails:
      type: object
      description: >-
        All of a transaction's details (TL-06), with the same values and formats as
        `TransactionListItem`, plus who created and last changed it and when. `createdBy` and
        `lastChangedBy` are "System" for a transaction as loaded (FP-08), or the name of the person
        who last changed it.
      required:
        - id
        - reference
        - transactionDate
        - accountNumber
        - description
        - amount
        - currency
        - transactionType
        - status
        - file
        - createdBy
        - createdAt
        - lastChangedBy
        - lastChangedAt
        - rejectionReason
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: TXN-0001
        transactionDate:
          type: string
          example: '2026-04-15T08:30:00'
        accountNumber:
          type: string
          example: '1234567890'
        description:
          type: string
          example: Salary
        amount:
          type: number
          format: decimal
          example: 1500.00
        currency:
          type: string
          example: ZAR
        transactionType:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        file:
          $ref: '#/components/schemas/TransactionFile'
        createdBy:
          type: string
          example: System
        createdAt:
          type: string
          format: date-time
        lastChangedBy:
          type: string
          example: System
        lastChangedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
          nullable: true
          description: The approver's reason; null unless the status is Rejected. It cannot be edited.
    RejectTransactionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: >-
            Why the transaction is rejected (RJ-01). Required; at most 500 characters once
            whitespace at the start and end is removed, counted as UTF-16 code units (RJ-02). It is
            stored trimmed.
          example: Duplicate payment; see TXN-0001
    TransactionConflict:
      type: object
      description: >-
        Returned with 409 when a transaction can no longer be approved or rejected because it is
        not Imported. Nothing was changed.
      required: [message, transaction]
      properties:
        message:
          type: string
          example: This transaction has already been approved.
        transaction:
          $ref: '#/components/schemas/TransactionDetails'
    ImportedTransactionCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int32
          description: How many transactions are still Imported, over every file that is not cancelled.
    ValidationProblem:
      type: object
      description: >-
        RFC 7807 validation problem details, with the failing fields under `errors`.
        Every key in `errors` is the name the client sends, in the same camelCase as
        the request, so a key can be matched to the input it is about without any
        mapping: a query or route parameter by its name (e.g. `pageSize`, `minAmount`,
        `fileId`); a multipart form field by its name (e.g. `file`, `kind`); and a member
        of a JSON request body by its path within the body, using the members' JSON names
        joined with `.` and array items indexed from 0 (e.g. `email`, `reason`, `rows`,
        `corrections[0].amount`). This also applies when a body member's JSON value cannot
        be read, such as a number sent where text is expected. A problem with the body as a
        whole (a body that is missing, empty, not valid JSON or not a JSON object) is
        reported under the key `$`, the JSON path of the whole body. The messages are meant
        for people and may name a field differently; only the keys are stable.
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
security:
  - sessionCookie: []
